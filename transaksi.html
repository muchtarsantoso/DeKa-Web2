<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaksi - DeKa Cell</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-gray-900 text-white flex justify-center">

    <div class="w-full max-w-md bg-gray-900 min-h-screen relative shadow-2xl pb-24">
        
        <header class="flex items-center p-4 sticky top-0 bg-gray-900 z-50 border-b border-gray-800">
            <a href="index.html" class="text-gray-400 hover:text-white mr-4">
                <i class="fas fa-arrow-left text-xl"></i>
            </a>
            <h1 class="font-bold text-lg">Isi Pulsa Telkomsel</h1>
        </header>

        <div class="p-4 flex items-center gap-4 bg-gray-800 border-b border-gray-700">
            <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center shadow-lg">
                <span class="text-red-600 font-bold text-3xl">T</span>
            </div>
            <div>
                <h2 class="font-bold text-xl">Telkomsel</h2>
                <p class="text-xs text-gray-400"><i class="fas fa-bolt text-yellow-400"></i> Proses Cepat 24/7</p>
            </div>
        </div>

        <main class="p-4 space-y-6">
            <div>
                <div class="flex items-center gap-2 mb-3">
                    <div class="w-6 h-6 rounded-full bg-blue-600 flex items-center justify-center text-xs font-bold">1</div>
                    <h3 class="font-bold">Masukkan Data Akun</h3>
                </div>
                <label class="text-xs text-gray-400 mb-1 block">Nomor Tujuan *</label>
                <input type="number" id="input-nomor" placeholder="08xxxxxxxxxx" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white focus:outline-none focus:border-blue-500 transition">
            </div>

            <div>
                <div class="flex items-center gap-2 mb-3">
                    <div class="w-6 h-6 rounded-full bg-blue-600 flex items-center justify-center text-xs font-bold">2</div>
                    <h3 class="font-bold">Pilih Nominal</h3>
                </div>
                <div class="grid grid-cols-2 gap-3" id="daftar-produk">
                    <div class="produk-item bg-gray-800 border border-gray-700 rounded-xl p-3 cursor-pointer transition" data-harga="5500">
                        <h4 class="font-bold text-lg pointer-events-none">5.000</h4>
                        <p class="text-sm text-blue-400 font-semibold pointer-events-none">Rp 5.500</p>
                    </div>
                    <div class="produk-item bg-gray-800 border border-gray-700 rounded-xl p-3 cursor-pointer transition" data-harga="10500">
                        <h4 class="font-bold text-lg pointer-events-none">10.000</h4>
                        <p class="text-sm text-blue-400 font-semibold pointer-events-none">Rp 10.500</p>
                    </div>
                    <div class="produk-item bg-gray-800 border border-gray-700 rounded-xl p-3 cursor-pointer transition relative overflow-hidden" data-harga="19900">
                        <div class="absolute top-0 right-0 bg-red-500 text-white text-[10px] font-bold px-2 py-1 rounded-bl-lg pointer-events-none">PROMO</div>
                        <h4 class="font-bold text-lg pointer-events-none">20.000</h4>
                        <p class="text-sm text-blue-400 font-semibold pointer-events-none">Rp 19.900</p>
                    </div>
                    <div class="produk-item bg-gray-800 border border-gray-700 rounded-xl p-3 cursor-pointer transition" data-harga="49500">
                        <h4 class="font-bold text-lg pointer-events-none">50.000</h4>
                        <p class="text-sm text-blue-400 font-semibold pointer-events-none">Rp 49.500</p>
                    </div>
                </div>
            </div>

            <div>
                <div class="flex items-center gap-2 mb-3">
                    <div class="w-6 h-6 rounded-full bg-blue-600 flex items-center justify-center text-xs font-bold">3</div>
                    <h3 class="font-bold">Pilih Pembayaran</h3>
                </div>
                <div id="metode-qris" class="bg-gray-800 border border-gray-700 rounded-xl p-4 flex justify-between items-center cursor-pointer transition">
                    <div class="flex items-center gap-3 pointer-events-none">
                        <i class="fas fa-qrcode text-2xl text-blue-400"></i>
                        <div>
                            <h4 class="font-bold text-sm">QRIS All Payment</h4>
                            <p class="text-xs text-gray-400">Bebas biaya admin</p>
                        </div>
                    </div>
                    <div id="radio-qris" class="w-5 h-5 rounded-full border-2 border-gray-500 pointer-events-none transition"></div>
                </div>
            </div>
        </main>

        <div class="fixed bottom-0 w-full max-w-md bg-gray-900 border-t border-gray-800 p-4 flex justify-between items-center z-50">
            <div>
                <p class="text-xs text-gray-400 mb-1">Total Harga</p>
                <p id="total-harga-teks" class="font-bold text-lg text-blue-400">-</p>
            </div>
            <button id="tombol-pesan" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-full transition shadow-lg flex items-center gap-2 opacity-50 cursor-not-allowed">
                <i class="fas fa-shopping-bag"></i> Pesan Sekarang!
            </button>
        </div>

    </div>

    <script>
        const produkItems = document.querySelectorAll('.produk-item');
        const teksTotalHarga = document.getElementById('total-harga-teks');
        const tombolPesan = document.getElementById('tombol-pesan');
        
        const metodeQris = document.getElementById('metode-qris');
        const radioQris = document.getElementById('radio-qris');

        let hargaTerpilih = 0;
        let pembayaranTerpilih = false;

        // Fungsi format Rupiah
        function formatRupiah(angka) {
            return 'Rp ' + angka.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        }

        // Fungsi Cek Kelengkapan untuk mengaktifkan tombol Pesan
        function cekKelengkapan() {
            if (hargaTerpilih > 0 && pembayaranTerpilih) {
                tombolPesan.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        // Saat kotak nominal diklik
        produkItems.forEach(item => {
            item.addEventListener('click', function() {
                // Matikan warna biru di semua kotak
                produkItems.forEach(el => {
                    el.classList.remove('border-blue-500', 'bg-gray-700');
                    el.classList.add('border-gray-700', 'bg-gray-800');
                });
                
                // Nyalakan warna biru di kotak yang diklik
                this.classList.remove('border-gray-700', 'bg-gray-800');
                this.classList.add('border-blue-500', 'bg-gray-700');

                // Ambil harga dari kotak tersebut dan ubah teks di bawah
                hargaTerpilih = parseInt(this.getAttribute('data-harga'));
                teksTotalHarga.innerText = formatRupiah(hargaTerpilih);
                
                cekKelengkapan();
            });
        });

        // Saat metode QRIS diklik
        metodeQris.addEventListener('click', function() {
            this.classList.add('border-blue-500');
            radioQris.classList.add('bg-blue-500', 'border-blue-500');
            pembayaranTerpilih = true;
            
            cekKelengkapan();
        });
    </script>
</body>
</html>
